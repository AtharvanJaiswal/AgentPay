name: AgentPay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.15.4
          run_install: false

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm format

      - name: Run linter (ESLint)
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.15.4
          run_install: false

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build contracts & shared packages
        run: |
          pnpm --filter @agentpay/contracts run build
          pnpm --filter @agentpay/config run build
          pnpm --filter @agentpay/logger run build
          pnpm --filter @agentpay/test-utils run build

      - name: Run Unit Tests
        run: pnpm test:unit

      - name: Run Integration Tests & Migration Verifications
        run: pnpm test:integration

  docker-and-e2e:
    name: Docker Build & Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.15.4
          run_install: false

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build All Docker Images
        run: docker compose build

      - name: Start Docker Stack in Test Environment
        run: |
          docker compose up -d
          # Wait for healthy services
          timeout 60 bash -c 'until docker compose ps | grep -q "(healthy)"; do sleep 2; done'
          docker compose ps

      - name: Install Playwright Browsers & OS Dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'
          PLAYWRIGHT_TEST_BASE_URL: 'http://localhost:3000'
        run: pnpm test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Stop and cleanup Docker Stack
        if: always()
        run: docker compose down
