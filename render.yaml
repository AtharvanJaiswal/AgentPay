services:
  - type: web
    name: agentpay
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: development
      - key: APP_ENV
        value: development
      - key: LOG_LEVEL
        value: info
      - key: ALLOW_DEV_IDENTITY
        value: "true"
      - key: PAYMENT_PROVIDER
        value: paypal_sandbox
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PRODUCT_DISCOVERY_PROVIDER
        value: mock
      - key: CHANNEL3_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agentpay-db
          property: connectionString

databases:
  - name: agentpay-db
    databaseName: agentpay
    user: agentpay
    plan: free
    region: oregon
